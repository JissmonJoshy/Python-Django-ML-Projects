{% extends 'userHome.html' %} {% block content %}


<style>
    .cards {
      background: #f8f9fa;
      padding: 60px 0;
    }
    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease-in-out;
      text-align: center;
      margin: 15px 0;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.2);
    }
    .card span {
      font-size: 18px;
      font-weight: bold;
      color: #007bff;
    }
    .card h4 {
      font-size: 22px;
      font-weight: 600;
      margin: 10px 0;
      color: #333;
    }
    .card p {
      font-size: 20px;
      font-weight: 700;
      color: #ff4b5c;
      background: #ffecec;
      padding: 5px 10px;
      display: inline-block;
      border-radius: 5px;
    }
  </style>
  
  <!-- Cards Section -->
  

  <section id="cards" class="cards section">
    <!-- Section Title -->
  <div class="container section-title" data-aos="fade-up">
    <span>Available Parkings</span>
    <h2>Available Parkings</h2>
    <p></p>
  </div><!-- End Section Title -->
    <div class="container">
      <div class="row no-gutters">
        {% for i in data %}
        <div class="col-lg-4 col-md-6">
          <div class="card" data-aos="fade-up" data-aos-delay="100">
            <h4>{{ i.location }}</h4>
            <p>contact : <br>
                {{ i.email }}, {{ i.phone }}
            </p> <br>
            
            <a href="/userAvailableSlots?id={{ i.id }}" class="btn btn-success">View Available Slots</a>
            
          </div>
        </div><!-- End Card Item -->
        {% endfor %}
      </div>
    </div>
  </section><!-- /Cards Section -->

{% endblock %}
