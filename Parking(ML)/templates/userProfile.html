{% extends 'userHome.html' %} {% block content %}

<section id="cards" class="cards section">
    <!-- Section Title -->
  <div class="container section-title" data-aos="fade-up">
    <span>Profile</span>
    <h2>Profile</h2>
    <p></p>
  </div><!-- End Section Title -->
  
  <div class="row justify-content-center">
    <div class="col-lg-4">
        <div class="card shadow-sm p-4 border-0 rounded-3">
            <form action="" method="post" data-aos="fade-up" data-aos-delay="200" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" name="name" value="{{ name }}" >
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" value="{{ email }}" >
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="tel" class="form-control" name="phone" value="{{ phone }}"  >
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <textarea class="form-control" name="address" rows="3"  >{{ address }}</textarea>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Change Password</label>
                    <input type="password" class="form-control" name="password" placeholder="Enter new password" 
                           pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,}$" 
                           title="Must contain at least one number, one uppercase and lowercase letter, and at least 8 characters">
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary w-100">Update Profile</button>
                </div>
            </form>
        </div>
    </div>
</div>


  </section><!-- /Cards Section -->

{% endblock %}
