{% extends 'index.html' %} {% block content %}

<!-- Contact Section -->
<section id="contact" class="contact section">

    <!-- Section Title -->
    <div class="container section-title" data-aos="fade-up">
      <span>Login</span>
      <h2>Login</h2>
      <p></p>
    </div><!-- End Section Title -->

    <div class="container" data-aos="fade-up" data-aos-delay="100">

      

      <div class="row gy-4 mt-1">
        

        <style>
            .form-container {
              background: #f8f9fa;
              padding: 30px;
              border-radius: 10px;
              box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            }
            .form-control {
              border-radius: 8px;
              border: 1px solid #ced4da;
              padding: 10px;
            }
            .form-control:focus {
              border-color: #007bff;
              box-shadow: 0px 0px 5px rgba(0, 123, 255, 0.5);
            }
            button {
              background: #007bff;
              color: white;
              padding: 10px 15px;
              border: none;
              border-radius: 8px;
              cursor: pointer;
              width: 100%;
              font-size: 16px;
              transition: 0.3s;
            }
            button:hover {
              background: #0056b3;
            }
          </style>
          <center>
          <div class="col-lg-6">
         
            <div class="form-container">
                <form action="" method="post" data-aos="fade-up" data-aos-delay="400">
                    {% csrf_token %}
                  <div class="row gy-4">
            
                    <div class="col-md-12">
                      <input type="text" name="name" class="form-control" placeholder="Username" required>
                    </div>
            
            
                    <div class="col-md-12">
                      <input type="password" 
                      class="form-control" name="password" placeholder="Password" required>
                    </div>
            
                    
            
            
                    <div class="col-md-12">
                      <button type="submit">Login</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
         
          

      </div>
    </center>

    </div>

  </section><!-- /Contact Section -->


{% endblock %}
