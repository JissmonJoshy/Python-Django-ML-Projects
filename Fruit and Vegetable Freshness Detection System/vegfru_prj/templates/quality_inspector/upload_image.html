{% extends "quality_inspector/common.html" %}
{% load static %}

{% block content %}
<br><br><br><br>
<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-6">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h4>Upload Fruit Image</h4>

</div>

<div class="card-body">

<form method="POST"

enctype="multipart/form-data">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">

Choose Image

</label>

<input

type="file"

name="image"

class="form-control"

required>

</div>

<button

class="btn btn-success w-100">

Upload & Predict

</button>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
