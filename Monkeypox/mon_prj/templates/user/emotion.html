{% extends "user/common.html" %}
{% load static %}
{% block content %}

<br><br><br>

<section class="contact section-padding">
    <div class="container">

        {% if messages %}
            {% for i in messages %}
                <div class="alert alert-info text-center">
                    {{ i }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="row justify-content-center">

            <div class="col-lg-7 col-md-9 col-sm-12">

                <div class="card shadow-lg border-0">

                    <!-- HEADER -->
                    <div class="card-header bg-dark text-white text-center">
                        <h5 class="mb-0">Monkeypox Emotion Detection</h5>
                    </div>

                    <!-- BODY -->
                    <div class="card-body p-4">

                        <form method="POST">
                            {% csrf_token %}

                            <div class="form-group mb-3">
                                <label class="form-label fw-bold">Enter Text</label>
                                <textarea 
                                    name="text" 
                                    rows="6" 
                                    class="form-control"
                                    placeholder="Type your text here for emotion prediction..."
                                    style="resize:none;">
                                </textarea>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-primary px-4 py-2">
                                    Predict Emotion
                                </button>
                            </div>

                        </form>

                        {% if result %}
                            <hr>
                            <div class="alert alert-success text-center mt-3">
                                <h5 class="mb-0" style="font-weight: bold; color: #155724;">
                                    Predicted Emotion: <strong>{{ result }}</strong>
                                </h5>
                            </div>
                        {% endif %}

                    </div>

                </div>

            </div>

        </div>

    </div>
</section>

{% endblock %}
