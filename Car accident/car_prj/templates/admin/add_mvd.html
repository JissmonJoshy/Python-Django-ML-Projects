{% extends "admin/common.html" %}
{% load static %}
{% block content %}

<!-- Header Banner -->
<section class="banner-header middle-height section-padding bg-img"
    data-overlay-dark="6"
    data-background="{% static 'img/slider/7.jpg' %}">

    <div class="v-middle">
        <div class="container">
            <div class="row">
                <div class="col-md-12 text-center">
                    <h6>Admin Panel</h6>
                    <h1>Add <span>MVD Officer</span></h1>
                </div>
            </div>
        </div>
    </div>

</section>


<!-- Add MVD Form -->
<section class="contact section-padding">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="form-box">

                    <h5 class="mb-4 text-center">
                        Register MVD Officer
                    </h5>

                    {% if messages %}
                        {% for i in messages %}
                            <div class="alert alert-success">
                                {{ i }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post"
                          enctype="multipart/form-data">

                        {% csrf_token %}

                        <div class="row">

                            <!-- Full Name -->
                            <div class="col-md-6 form-group">
                                <input type="text"
                                       name="name"
                                       placeholder="Full Name"
                                       required>
                            </div>

                            <!-- Email -->
                            <div class="col-md-6 form-group">
                                <input type="email"
                                       name="email"
                                       placeholder="Email Address"
                                       required>
                            </div>

                            <!-- Phone -->
                            <div class="col-md-6 form-group">
                                <input type="text"
                                       name="phone"
                                       placeholder="Phone Number"
                                       required>
                            </div>

                            <!-- Job Post -->
                            <div class="col-md-6 form-group">
                                <input type="text"
                                       name="job_post"
                                       placeholder="Job Post"
                                       required>
                            </div>

                            <!-- Date of Birth -->
                            <div class="col-md-6 form-group">
                                <label>Date of Birth</label>
                                <input type="date"
                                       name="dob"
                                       class="form-control"
                                       required>
                            </div>

                            <!-- Gender -->
                            <div class="col-md-6 form-group">
                                <label>Gender</label>

                                <select name="gender"
                                        class="form-control"
                                        required>

                                    <option value="">
                                        Select Gender
                                    </option>

                                    <option value="Male">
                                        Male
                                    </option>

                                    <option value="Female">
                                        Female
                                    </option>

                                    <option value="Other">
                                        Other
                                    </option>

                                </select>
                            </div>

                            <!-- Address -->
                            <div class="col-md-12 form-group">
                                <textarea name="address"
                                          rows="4"
                                          placeholder="Address"
                                          required></textarea>
                            </div>

                            <!-- Profile Image -->
                            <div class="col-md-6 form-group">

                                <label>
                                    Upload Profile Picture
                                </label>

                                <input type="file"
                                       name="profile_pic"
                                       class="form-control"
                                       required>

                            </div>

                            <!-- Aadhar Card -->
                            <div class="col-md-6 form-group">

                                <label>
                                    Upload Aadhar Card
                                </label>

                                <input type="file"
                                       name="aadhar_image"
                                       class="form-control"
                                       required>

                            </div>

                            <!-- Experience -->
                            <div class="col-md-6 form-group">
                                <input type="text"
                                       name="experience"
                                       placeholder="Experience (Optional)">
                            </div>

                            <!-- City -->
                            <div class="col-md-6 form-group">
                                <input type="text"
                                       name="city"
                                       placeholder="City"
                                       required>
                            </div>

                            <!-- Emergency Contact -->
                            <div class="col-md-6 form-group">
                                <input type="text"
                                       name="emergency_contact"
                                       placeholder="Emergency Contact Number">
                            </div>

                            <!-- Blood Group -->
                            <div class="col-md-6 form-group">

                                <select name="blood_group"
                                        class="form-control">

                                    <option value="">
                                        Select Blood Group
                                    </option>

                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>

                                </select>

                            </div>

                            <!-- Submit -->
                            <div class="col-md-12 text-center mt-3">

                                <input type="submit"
                                       value="Add MVD Officer">

                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
