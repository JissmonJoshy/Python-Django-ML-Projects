{% extends "mvd/common.html" %}
{% load static %}
{% block content %}

<section class="banner-header middle-height section-padding bg-img"
    data-overlay-dark="6"
    data-background="{% static 'img/slider/7.jpg' %}">

    <div class="v-middle text-center">
        <h6>MVD Profile</h6>
        <h1>Edit <span>Profile</span></h1>
    </div>

</section>


<section class="section-padding">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-10">

<div class="card shadow p-4 border-0">

<h4 class="mb-4">Update Profile Details</h4>


{% if messages %}
    {% for i in messages %}
        <div class="alert alert-{{ i.tags }}">
            {{ i }}
        </div>
    {% endfor %}
{% endif %}


<form method="post" enctype="multipart/form-data">

{% csrf_token %}

<div class="row g-3">

<!-- NAME -->
<div class="col-md-6">
    <label>Name</label>
    <input type="text" name="name" value="{{ mvd.name }}" class="form-control" required>
</div>

<!-- PHONE -->
<div class="col-md-6">
    <label>Phone</label>
    <input type="text" name="phone" value="{{ mvd.phone }}" class="form-control" required>
</div>

<!-- EMAIL (readonly) -->
<div class="col-md-6">
    <label>Email (cannot change)</label>
    <input type="text" value="{{ mvd.email }}" class="form-control" readonly>
</div>

<!-- DOB -->
<div class="col-md-6">
    <label>Date of Birth</label>
    <input type="date" name="dob" value="{{ mvd.dob|date:'Y-m-d' }}" class="form-control" required>
</div>

<!-- GENDER -->
<div class="col-md-6">
    <label>Gender</label>
    <select name="gender" class="form-control" required>
        <option value="Male" {% if mvd.gender == "Male" %}selected{% endif %}>Male</option>
        <option value="Female" {% if mvd.gender == "Female" %}selected{% endif %}>Female</option>
        <option value="Other" {% if mvd.gender == "Other" %}selected{% endif %}>Other</option>
    </select>
</div>

<!-- JOB POST -->
<div class="col-md-6">
    <label>Job Post</label>
    <input type="text" name="job_post" value="{{ mvd.job_post }}" class="form-control" required>
</div>

<!-- ADDRESS -->
<div class="col-md-12">
    <label>Address</label>
    <textarea name="address" class="form-control" required>{{ mvd.address }}</textarea>
</div>

<!-- EXPERIENCE -->
<div class="col-md-12">
    <label>Experience</label>
    <input type="text" name="experience" value="{{ mvd.experience }}" class="form-control">
</div>

<!-- PROFILE IMAGE -->
<div class="col-md-6">
    <label>Profile Picture</label><br>
    <img src="{{ mvd.profile_pic.url }}" width="80" height="80" style="border-radius:50%; margin-bottom:10px;">
    <input type="file" name="profile_pic" class="form-control">
</div>

<!-- AADHAR -->
<div class="col-md-6">
    <label>Aadhar Image</label><br>
    <a href="{{ mvd.aadhar_image.url }}" target="_blank">View Current</a><br>
    <input type="file" name="aadhar_image" class="form-control mt-2">
</div>

<!-- STATUS -->
{% comment %} <div class="col-md-6">
    <label>Status</label>
    <select name="status" class="form-control">
        <option value="active" {% if mvd.status == "active" %}selected{% endif %}>Active</option>
        <option value="inactive" {% if mvd.status == "inactive" %}selected{% endif %}>Inactive</option>
    </select>
</div> {% endcomment %}

<!-- SUBMIT -->
<div class="col-md-12 text-center mt-4">

    <button type="submit" class="btn btn-success px-5">
        Update Profile
    </button>

</div>

</div>

</form>

</div>

</div>

</div>

</div>

</section>

{% endblock %}
