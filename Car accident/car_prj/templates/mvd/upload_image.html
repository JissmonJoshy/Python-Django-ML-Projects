{% extends "mvd/common.html" %}
{% load static %}
{% block content %}

<section class="section-padding">
    <div class="container">

        <div class="prediction-card">

            <div class="title-area">
                <h2>Accident Detection System</h2>
                <p>
                    Upload a road or traffic image to analyze whether an
                    accident is detected using the trained AI model.
                </p>
            </div>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="form-group">

                    <label>Select Image</label>

                    <input
                        type="file"
                        name="image"
                        accept="image/*"
                        required>

                </div>

                <button type="submit" class="predict-btn">
                    Predict Accident
                </button>

            </form>

        </div>

    </div>
</section>

<style>

.prediction-card{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:40px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.1);
}

.title-area{
    text-align:center;
    margin-bottom:30px;
}

.title-area h2{
    font-size:32px;
    margin-bottom:10px;
}

.title-area p{
    color:#666;
    line-height:1.8;
}

.form-group{
    margin-bottom:25px;
}

.form-group label{
    display:block;
    font-weight:600;
    margin-bottom:10px;
}

.form-group input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
}

.predict-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:8px;
    background:#d4a017;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.predict-btn:hover{
    opacity:0.9;
}

</style>

{% endblock %}
