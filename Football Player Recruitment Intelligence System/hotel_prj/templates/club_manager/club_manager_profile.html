{% extends 'club_manager/common.html' %}
{% load static %}
{% block content %}

<br><br><br><br>

<section class="contact section-padding">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-10">

<div class="card border-0 shadow-lg rounded-4">

<div class="card-header text-center text-white py-4"
style="background:#0d6efd;">

<h3 class="mb-0">
Club Manager Profile
</h3>

</div>

<div class="card-body p-5">

{% if messages %}
{% for i in messages %}
<div class="alert alert-success">
{{ i }}
</div>
{% endfor %}
{% endif %}

<form method="post" enctype="multipart/form-data">

{% csrf_token %}

<div class="text-center mb-5">

<img src="{{ club.club_logo.url }}"
class="rounded-circle border shadow"
style="width:170px;height:170px;object-fit:cover;">

<div class="mt-3">

<label class="fw-bold">
Change Club Logo
</label>

<input type="file"
name="club_logo"
class="form-control mt-2">

</div>

</div>

<div class="row">

<div class="col-md-6 mb-4">

<label class="fw-bold">Club Name</label>

<input type="text"
class="form-control"
value="{{ club.club_name }}"
readonly>

</div>

<div class="col-md-6 mb-4">

<label class="fw-bold">Manager Name</label>

<input type="text"
name="manager_name"
class="form-control"
value="{{ club.manager_name }}"
required>

</div>

<div class="col-md-6 mb-4">

<label class="fw-bold">Email</label>

<input type="email"
name="email"
class="form-control"
value="{{ club.email }}">

</div>

<div class="col-md-6 mb-4">

<label class="fw-bold">Phone</label>

<input type="text"
name="phone"
class="form-control"
value="{{ club.phone }}">

</div>

<div class="col-md-6 mb-4">

<label class="fw-bold">Country</label>

<input type="text"
name="country"
class="form-control"
value="{{ club.country }}">

</div>

<div class="col-md-6 mb-4">

<label class="fw-bold">League</label>

<input type="text"
name="league"
class="form-control"
value="{{ club.league }}">

</div>

<div class="col-md-6 mb-4">

<label class="fw-bold">Club Budget</label>

<input type="number"
name="club_budget"
class="form-control"
value="{{ club.club_budget }}">

</div>

<div class="col-md-6 mb-4">

<label class="fw-bold">Established Year</label>

<input type="number"
name="established_year"
class="form-control"
value="{{ club.established_year }}">

</div>

<div class="col-12 mb-4">

<label class="fw-bold">Stadium</label>

<input type="text"
name="stadium"
class="form-control"
value="{{ club.stadium }}">

</div>

<div class="col-12 text-center">

<button class="btn btn-primary px-5 py-2">

Update Profile

</button>

</div>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</section>

{% endblock %}
